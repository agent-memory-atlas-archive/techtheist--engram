[package]
name = "knowledgedrift"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "KnowledgeDrift — an offline, judge-free benchmark for AI memory in software development"

[dependencies]
engram-core = { workspace = true }
engram-eval = { path = ".." }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[features]
# Real embeddings, reranker and NLI. Without it every model is a deterministic
# fake: the harness runs and the lexical path is exercised, but no semantic
# number is worth quoting — the receipt says so at the top.
fastembed = ["engram-core/fastembed", "engram-eval/fastembed"]

[[bin]]
name = "knowledgedrift"
path = "src/main.rs"
